[SERVER]
host = 0.0.0.0
port = 443

[BACKEND]
host = 127.0.0.1
port = 8000

# Certificates from DNASrep. cert-us is confirmed working with a US title.
# cert-eu / cert-jp are included for gate1.eu / gate1.jp (untested).
[SSL]
certificate_path = cert-us.pem
private_key_path = cert-us-key.pem
chain_path = ca-cert.pem

# Matches what the PS2 offers and what the original DNAS server negotiated.
[TLS]
min_version = SSLv3
max_version = TLSv1.0
ciphers = 3des, rc4
key_exchange = dhe_rsa, rsa
macs = sha, md5
split_first_record = no

# Seconds.
[TIMEOUTS]
handshake = 15
idle = 60
backend_connect = 10
close_linger = 5

